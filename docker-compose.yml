services:
  ai-researcher:
    build: .
    container_name: ai-researcher
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      AI_RESEARCH_TZ: Asia/Tokyo
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-service-account.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_GROUNDING_MODEL: ${GEMINI_GROUNDING_MODEL:-gemini-3.5-flash}
      GOOGLE_DRIVE_CLIENT_SECRET: /secrets/google-drive-oauth-client.json
      GOOGLE_DRIVE_TOKEN: /secrets/google-drive-token.json
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      QIITA_TOKEN: ${QIITA_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./secrets:/secrets

  ai-researcher-discord-bot:
    profiles: ["discord-bot"]
    build: .
    container_name: ai-researcher-discord-bot
    restart: unless-stopped
    command: ["python3", "-m", "ai_researcher.cli", "discord-bot"]
    environment:
      TZ: Asia/Tokyo
      AI_RESEARCH_TZ: Asia/Tokyo
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-service-account.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_GROUNDING_MODEL: ${GEMINI_GROUNDING_MODEL:-gemini-3.5-flash}
      GOOGLE_DRIVE_CLIENT_SECRET: /secrets/google-drive-oauth-client.json
      GOOGLE_DRIVE_TOKEN: /secrets/google-drive-token.json
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      QIITA_TOKEN: ${QIITA_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./secrets:/secrets
